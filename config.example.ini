; Bomb Voyage configuration template.
;
; Copy to config.ini (which is gitignored) and edit. Nothing here is needed for local
; development — `npm start` works with no config file at all.
;
; Every value can be overridden by an environment variable of the same name in upper case,
; e.g. LAG=200 npm start. Environment always wins over this file.

[server]
; 8080 locally, 443 in production.
port         = 8080
; Plain-HTTP listener used only for the HTTPS redirect and certificate renewal.
redirect_port = 80
; Used for redirect targets and logging. The hostname players type.
public_host  = localhost
; Leave both blank for plain HTTP. Set both to serve HTTPS directly.
tls_cert     =
tls_key      =
; Where leaderboard.json and the certificate copies live.
data_dir     = ./data
max_players  = 16
; Bots kept in the room while anyone is playing; removed after two empty rounds. 0 turns it off.
min_bots     = 6

[deploy]
; Shared secret for POST /deploy, used by the GitHub Actions deploy workflow.
; Generate with:  openssl rand -hex 32
; Blank disables the endpoint completely — that is the correct setting for a laptop.
token    =
; Used by infra/deploy.sh when pushing from a laptop.
ssh_host = your.server.example
ssh_user = ec2-user
ssh_key  = ~/.ssh/your-key.pem

[admin]
; Whoever's browser presents this key is always host. Open https://<host>/?admin=<key> once and
; the browser keeps it. Generate with:  openssl rand -hex 16
; Blank falls back to the name below, which anyone can type — fine on a laptop, not on a server.
key  =
name = cobusvw

[dev]
; Outbound delay in milliseconds, to develop against a realistic connection.
; The server refuses to start if either is non-zero while TLS is configured.
lag    = 0
jitter = 0
