<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bomb Voyage</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --gold:#ffd21f; --panel:#1a2029; --ink:#e8eef7; --dim:#8b97a8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0d1117; color: var(--ink);
               font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
                image-rendering: pixelated; }

  /* menu */
  #menu { position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
          background: radial-gradient(120% 90% at 50% 0%, #1b1430 0%, #0d1117 60%); }
  .card { border: 2px solid #ffd21f66; border-radius: 4px; background: #1a2029ee;
          padding: 30px 38px; width: 420px; box-shadow: 0 0 60px #6b21a855; position: relative; }
  #mascot { position: absolute; right: 18px; top: -48px; width: 192px; height: 192px;
            image-rendering: pixelated; pointer-events: none;
            filter: drop-shadow(0 6px 16px #000a); }
  h1 { color: var(--gold); font-size: 17px; letter-spacing: .2em; text-transform: uppercase;
       margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 22px; font-size: 12px; }
  label { display: block; color: var(--dim); font-size: 11px; letter-spacing: .1em;
          text-transform: uppercase; margin-bottom: 6px; }
  input[type=text] { width: 100%; font: inherit; font-size: 15px; color: var(--ink);
                     background: #0d1117; border: 1px solid #ffd21f55; border-radius: 3px;
                     padding: 9px 11px; }
  input[type=text]:focus { outline: none; border-color: var(--gold); }
  button { font: inherit; color: var(--gold); background: transparent;
           border: 1px solid #ffd21f88; border-radius: 3px; padding: 7px 16px; cursor: pointer; }
  button:hover { background: var(--gold); color: var(--panel); }
  button:disabled { opacity: .45; cursor: default; }
  button:disabled:hover { background: transparent; color: var(--gold); }
  #play { width: 100%; margin-top: 16px; padding: 11px; font-size: 15px; letter-spacing: .18em;
          text-transform: uppercase; }
  .keys { margin: 22px 0 0; padding: 0; list-style: none; color: var(--dim); font-size: 11px;
          display: grid; grid-template-columns: 7em 1fr; gap: 3px 10px; }
  .keys b { color: var(--ink); font-weight: normal; }

  /* hud */
  #hud { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 5;
         flex-direction: column; justify-content: space-between; padding: 10px 12px; }
  .bar { display: flex; gap: 14px; align-items: center; color: var(--dim); }
  .bar b { color: var(--ink); font-weight: normal; }
  #conn[data-state=open] { color: #5ad1a0; }
  #conn[data-state=reconnecting], #conn[data-state=connecting] { color: var(--gold); }
  /* z-index above the menu: the first thing it ever has to say is "server full". */
  #toast { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); z-index: 20;
           background: #1a2029dd; border: 1px solid #ffd21f66; border-radius: 3px;
           padding: 6px 14px; color: var(--gold); opacity: 0; transition: opacity .25s;
           pointer-events: none; }

  /* chat */
  #chat { pointer-events: auto; width: 340px; }
  #chatList { list-style: none; margin: 0 0 6px; padding: 0; max-height: 170px; overflow-y: auto;
              font-size: 12px; text-shadow: 0 1px 2px #000; }
  #chatList li { padding: 1px 0; }
  #chatInput { width: 100%; font: inherit; font-size: 12px; color: var(--ink);
               background: #0d1117cc; border: 1px solid #ffd21f44; border-radius: 3px;
               padding: 5px 8px; opacity: .45; }
  #chatInput:focus { outline: none; opacity: 1; border-color: var(--gold); }
  .right { margin-left: auto; display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  input[type=range] { width: 72px; accent-color: var(--gold); }
  .vlabel { color: var(--dim); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .gear { display: block; margin-top: 6px; color: var(--gold); font-size: 13px;
          text-shadow: 0 1px 2px #000; letter-spacing: .08em; }

  /* death + scores */
  /* Click-through except for the card, so the chat box underneath stays usable while dead —
     and for the twenty seconds of the round-over standings. */
  #dead { position: fixed; inset: 0; display: none; place-items: center; z-index: 8;
          background: #0d111788; pointer-events: none; }
  #dead .card { pointer-events: auto; }
  .card.small { width: 320px; text-align: center; }
  #deadText { white-space: pre-line; }
  .card.small h1 { color: #e8655a; }
  #respawn { width: 100%; margin-top: 10px; padding: 10px; letter-spacing: .14em;
             text-transform: uppercase; }
  #scores { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 9;
            display: none; background: #1a2029f2; border: 2px solid #ffd21f66; border-radius: 4px;
            padding: 18px 22px; min-width: 340px; }
  #scores table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #scores th { color: var(--dim); font-weight: normal; text-align: left; padding-bottom: 6px;
               border-bottom: 1px solid #ffd21f33; }
  #scores td { padding: 3px 10px 3px 0; }
  #scores .sub { margin: 12px 0 0; text-align: center; }
</style>

<canvas id="game"></canvas>

<div id="hud">
  <div class="bar">
    <span id="you">—</span>
    <span id="stat"></span>
    <span id="conn" data-state="connecting">connecting</span>
    <span class="right">
      <button id="musicBtn">♪ off</button>
      <input id="vol" type="range" min="0" max="100" value="10" title="music volume">
      <span class="vlabel">sfx</span>
      <input id="sfxVol" type="range" min="0" max="100" value="75" title="sound effect volume">
      <button id="leave" title="esc">leave</button>
    </span>
  </div>
  <div id="chat">
    <ul id="chatList"></ul>
    <input id="chatInput" placeholder="enter to chat" maxlength="140">
    <span id="gear" class="gear"></span>
  </div>
</div>

<div id="dead">
  <div class="card small">
    <h1 id="deadTitle">you died</h1>
    <p class="sub" id="deadText">space to respawn &middot; esc to leave</p>
    <button id="respawn">respawn</button>
  </div>
</div>

<div id="scores">
  <table>
    <thead><tr><th>#</th><th>name</th><th>k</th><th>d</th><th>score</th></tr></thead>
    <tbody id="scoreRows"></tbody>
  </table>
  <p class="sub">tab to close</p>
</div>

<div id="toast"></div>

<div id="menu">
  <div class="card">
    <canvas id="mascot" width="192" height="192"></canvas>
    <h1>Bomb Voyage</h1>
    <p class="sub">16 scoundrels &middot; 16 minutes &middot; one very short fuse</p>
    <label for="name">your name</label>
    <input id="name" type="text" placeholder="pick a name" autocomplete="off" autofocus>
    <button id="play">play</button>
    <ul class="keys">
      <li><b>arrows / wasd</b></li><li>move</li>
      <li><b>space / k</b></li><li>bomb</li>
      <li><b>enter</b></li><li>chat</li>
      <li><b>tab</b></li><li>scores</li>
    </ul>
  </div>
</div>

<script type="module" src="/client/main.js"></script>
