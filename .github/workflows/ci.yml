name: ci

# Tests only. Deployment is manual — `npm run deploy` from a laptop. This workflow needs no
# secrets and exists so a broken push is caught before someone deploys it.
#
# The server still has a token-gated POST /deploy that pulls from git and restarts, so turning
# automatic deploys back on is a job block plus two repo secrets. See docs/DEPLOY.md §6.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
